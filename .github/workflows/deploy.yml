name: Deploy to GitHub Pages

# Builds the site and publishes it to https://docs.gentorobotics.ai on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions", Custom domain: docs.gentorobotics.ai
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
        env:
          DOCS_URL: https://docs.gentorobotics.ai
          DOCS_BASE_URL: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
